<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>事件规则 · 可操作小样</title>
<style>
:root{color-scheme:light;--ink:#293548;--muted:#748095;--line:#e0e6ef;--accent:#5266d8}*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:var(--ink);font:14px/1.65 system-ui,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:7px 11px}button:hover:not(:disabled){border-color:var(--accent);background:#f0f3ff}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--accent);color:white}.small{font-size:12px;padding:3px 7px}.danger{color:#bd4058}input[type=checkbox]{accent-color:var(--accent)}input[type=text],input[type=number],select,textarea{border:1px solid #d4dce9;border-radius:6px;padding:6px 8px;background:white;color:var(--ink);max-width:100%}input[type=text],textarea{width:100%}input[type=number]{width:74px}input[type=color]{width:42px;height:32px;padding:2px;border:1px solid var(--line);background:white;border-radius:6px}textarea{resize:vertical;min-height:88px}h1{font-size:25px;margin:0}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}p{margin:6px 0 12px}.muted,.hint{font-size:12px;color:var(--muted)}.wrap{max-width:1260px;padding:25px 22px 40px;margin:auto}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.head{margin-bottom:17px}.intro{background:#eaf0ff;border:1px solid #dce4ff;border-radius:10px;padding:12px 16px;margin-bottom:18px}.layout{display:grid;grid-template-columns:minmax(340px,.9fr) minmax(440px,1.1fr);gap:20px;align-items:start}.card{border:1px solid var(--line);background:white;border-radius:12px;padding:18px;margin-bottom:16px}.sticky{position:sticky;top:14px}.badge{border-radius:16px;background:#edf0ff;color:#5263bc;padding:3px 9px;font-size:12px}.stage{background:#fafbfe;border:1px solid var(--line);border-radius:10px;padding:25px 15px;margin:14px 0}.running{display:flex;align-items:center;gap:10px;font-weight:600;min-height:32px}.icon{font-size:22px}.sweep{background:linear-gradient(100deg,currentColor 25%,#fff 48%,currentColor 70%);background-size:220% 100%;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shine 2s linear infinite}@keyframes shine{from{background-position:180% 0}to{background-position:-80% 0}}.flow{font-size:12px;display:grid;gap:5px}.flow>div{display:grid;grid-template-columns:68px 1fr;gap:6px}.why{margin-top:12px;background:#edf6f0;color:#456b55;padding:9px 11px;border-radius:8px;font-size:12px}.section{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}.tools{margin-top:15px}.tool{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #edf0f6}.tool-name{flex:1}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7b8ee2;margin-right:6px}.log{font-size:12px;color:var(--muted);max-height:175px;overflow:auto;padding-left:19px;margin:0}.log li{padding:3px 0}.tabs{display:flex;gap:4px;background:#e9edf5;padding:5px;border-radius:9px;margin-bottom:15px}.tabs button{flex:1;border:0;background:transparent}.tabs button.active{background:white;color:var(--accent);font-weight:600;box-shadow:0 1px 4px #18284114}.field{display:grid;gap:6px;margin:10px 0}.field>span{font-size:12px;color:var(--muted)}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{background:#f7f9fc;border:1px solid #e7ecf3;border-radius:8px;padding:11px}.choices{display:flex;flex-wrap:wrap;gap:6px}.check{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px}.rule{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0}.rule.open{border-color:#9ba9ec}.rule.hit{box-shadow:inset 3px 0 #7286d8}.rule-head{display:flex;gap:7px;align-items:center;padding:10px;background:#fafbfe}.rule-title{flex:1;min-width:0}.rule-summary{font-size:12px;color:var(--muted);padding:0 12px 9px}.rule-body{border-top:1px solid var(--line);padding:2px 12px 12px}.pill{background:#e6f3e9;color:#52705e;border-radius:4px;padding:1px 5px;font-size:11px}.preset{padding:11px;border:1px solid var(--line);border-radius:8px;margin:9px 0}.footer{margin-top:16px;font-size:12px;color:var(--muted)}.empty{font-size:12px;color:var(--muted);padding:10px 0}:focus-visible{outline:3px solid #a8b5fa;outline-offset:2px}@media(max-width:900px){.layout{grid-template-columns:1fr}.sticky{position:static}.wrap{padding:17px 12px}}@media(max-width:450px){.cols{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.sweep{animation:none}}
</style></head>
<body><div class="wrap">
<header class="head row between"><div><h1>事件规则，点一下就懂</h1><div class="muted">独立交互小样 · 不连接真实 Agent · 不修改插件配置</div></div><button data-act="reset">恢复初始设置</button></header>
<div class="intro"><b>先试三步：</b>① 点“开始搜索”看状态变化 → ② 点工具旁的“失败”看错误提示 → ③ 等 2 秒，自动回到剩余活动或默认状态。<br><span class="muted">右侧配置都可以修改。仅在本页生效，刷新页面会恢复初始设置。</span></div>
<main class="layout"><div class="sticky">
<section class="card"><div class="row between"><h2 style="margin:0">① 模拟 Agent</h2><span id="run-state" class="badge"></span></div><div class="stage"><div id="running" class="running" aria-live="polite"><span id="icon" class="icon"></span><span id="label"></span></div><div id="duration" class="muted" style="margin-top:8px"></div></div><div id="explanation"></div>
<div class="section"><div class="row"><button class="primary" data-act="tool" data-kind="search">⌕ 开始搜索</button><button data-act="tool" data-kind="read">▤ 读取文件</button><button data-act="tool" data-kind="write">✎ 修改文件</button><button data-act="tool" data-kind="command">› 执行命令</button></div><div class="row" style="margin-top:9px"><button data-act="parallel">同时开始两个搜索</button><button id="error-button" data-act="error">模拟工具报错</button><button id="step-button" data-act="step">下一步骤</button></div><div id="activities" class="tools"></div></div>
<div class="section row"><button data-act="new-turn">开始新一轮</button><button id="end-button" data-act="end">结束本轮</button><span class="muted">一轮 = 一次连续运行</span></div></section>
<section class="card"><h2>刚刚发生了什么</h2><ol id="log" class="log" aria-live="polite"></ol></section></div>
<section class="card"><h2>② 配置策略</h2><nav class="tabs" aria-label="配置分类"><button data-tab="rules" class="active">事件规则</button><button data-tab="base">默认与轮换</button><button data-tab="presets">预设内容</button></nav><div id="settings"></div><div class="footer">交互草图，不代表最终插件界面。默认样式与文案均为示例。</div></section>
</main></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ck=v=>v?' checked':'';
const opt=(id,name,value)=>'<option value="'+esc(id)+'"'+(id===value?' selected':'')+'>'+esc(name)+'</option>';
const kinds={search:'搜索代码',read:'读取文件',write:'修改文件',command:'执行命令',tool:'任意工具'};
const pulses={error:'工具失败',success:'工具成功'};
function selection(looks,groups,lineMode='sequential'){return{lookMode:looks.length>1?'random':'fixed',lookIds:looks,fixedLook:looks[0],groupMode:groups.length>1?'random':'fixed',groupIds:groups,fixedGroup:groups[0],lineMode};}
function initial(){return{
 enabled:true,
 looks:[{id:'plain',name:'普通灰',color:'#657185',icon:'◌',size:16,sweep:false},{id:'blue',name:'搜索蓝',color:'#477bdd',icon:'⌕',size:16,sweep:true},{id:'green',name:'编码绿',color:'#23866d',icon:'✎',size:16,sweep:true},{id:'purple',name:'灵感紫',color:'#8a61c9',icon:'✦',size:16,sweep:true},{id:'red',name:'错误红',color:'#cb4d63',icon:'!',size:16,sweep:false}],
 groups:[{id:'general',name:'日常思考',lines:['正在认真思考…','正在组织思路…','再想一想，很快就好…']},{id:'searching',name:'搜索文案',lines:['正在翻找代码…','正在寻找相关文件…','线索就在附近…']},{id:'coding',name:'编码文案',lines:['正在修改代码…','正在把想法写进文件…','细节正在落地…']},{id:'errors',name:'错误文案',lines:['刚才遇到问题，正在检查…','工具没有成功，换个办法…']}],
 base:selection(['plain'],['general']),
 triggers:{look:{turn:true,time:false,seconds:5,step:false,every:2},text:{turn:true,time:true,seconds:4,step:false,every:2}},
 rules:[{id:'error',name:'工具报错时',enabled:true,kind:'pulse',any:['error'],hold:2,selection:selection(['red'],['errors'],'random')},{id:'write',name:'正在修改文件',enabled:true,kind:'activity',any:['write'],hold:2,selection:selection(['green'],['coding'])},{id:'search',name:'正在搜索或读取',enabled:true,kind:'activity',any:['search','read'],hold:2,selection:selection(['blue','purple'],['searching'])},{id:'tools',name:'任意工具工作中',enabled:false,kind:'activity',any:['tool'],hold:2,selection:selection(['purple'],['general'],'random')}]
};}
let config=initial(),tab='rules',editing='search',serial=0,ruleSerial=0;
const run={active:true,turn:1,step:0,calls:[],pulses:[],context:null,signature:'',look:null,group:null,line:'',last:-Infinity,next:{look:null,text:null},origin:{look:0,text:0},cursor:{},pending:false,reason:'',logs:[],started:Date.now()};
function note(text){run.logs.unshift(text);run.logs=run.logs.slice(0,18);}
function currentSelection(){const r=config.rules.find(r=>r.id===run.context);return r?r.selection:config.base;}
function winner(){if(!config.enabled||!run.active)return null;return config.rules.find(r=>r.enabled&&r.any.length&&(r.kind==='activity'?run.calls.some(c=>r.any.includes(c.kind)||r.any.includes('tool')):run.pulses.some(p=>r.any.includes(p.kind)&&Date.now()-p.at<r.hold*1000)))||null;}
function choose(items,mode,ids,fixed){if(mode==='fixed')return items.find(i=>i.id===fixed)||items[0];const pool=items.filter(i=>ids.includes(i.id));return pool[Math.floor(Math.random()*pool.length)]||items[0];}
function draw(layer){const s=currentSelection();if(layer==='look'){run.look=choose(config.looks,s.lookMode,s.lookIds,s.fixedLook);return;}run.group=choose(config.groups,s.groupMode,s.groupIds,s.fixedGroup);const lines=run.group.lines.filter(t=>t.trim());const key=run.context+':'+run.group.id;if(!lines.length)run.line='（这组文案为空）';else if(s.lineMode==='first')run.line=lines[0];else if(s.lineMode==='random')run.line=lines[Math.floor(Math.random()*lines.length)];else{const i=run.cursor[key]||0;run.line=lines[i%lines.length];run.cursor[key]=i+1;}}
function schedule(layer){const t=config.triggers[layer];run.next[layer]=run.active&&t.time?Date.now()+t.seconds*1000:null;}
function reconcile(reason,force=false){if(!run.active)return false;const r=winner(),id=r?r.id:'base',signature=JSON.stringify(r?r.selection:config.base);if(run.context===id&&run.signature===signature&&!force){run.pending=false;return false;}if(!force&&run.context!==null&&Date.now()-run.last<500&&!(r&&r.kind==='pulse'&&r.any.includes('error'))){run.pending=true;run.reason=reason;return false;}run.context=id;run.signature=signature;run.last=Date.now();run.pending=false;draw('look');draw('text');for(const layer of ['look','text']){run.origin[layer]=run.step;schedule(layer);}note(reason+' → '+(r?'命中「'+r.name+'」':'使用默认选择')+'，刷新一次');return true;}
function startTool(kind){if(!run.active)newTurn();run.calls.push({id:++serial,kind});note(kinds[kind]+' #'+serial+' 开始');reconcile('活动改变');render();}
function pulse(kind){run.pulses.push({kind,at:Date.now()});note(pulses[kind]+'：检查瞬时规则');reconcile(pulses[kind]);}
function finish(id,failed){const c=run.calls.find(c=>c.id===id);if(!c)return;run.calls=run.calls.filter(c=>c.id!==id);note(kinds[c.kind]+' #'+id+(failed?' 失败':' 结束'));pulse(failed?'error':'success');reconcile('工具结束，检查剩余活动');render();}
function newTurn(){const keep=run.context==='base'&&run.signature===JSON.stringify(config.base);run.active=true;run.turn++;run.started=Date.now();run.step=0;run.calls=[];run.pulses=[];run.pending=false;run.origin={look:0,text:0};if(keep){run.signature=JSON.stringify(config.base);for(const layer of ['look','text']){if(config.triggers[layer].turn)draw(layer);schedule(layer);}note('新一轮开始：按每轮开关更新，关闭的层保留上次默认结果');}else{run.context=null;reconcile('新一轮开始',true);}render();}
function endTurn(){run.active=false;run.calls=[];run.pulses=[];run.pending=false;run.next={look:null,text:null};note('本轮结束：停止轮换，清空活动和短暂提示');render();}
function advanceStep(){if(!run.active)return;run.step++;const changed=reconcile('进入新步骤');if(!changed&&!run.pending){const layers=[];for(const layer of ['look','text']){const t=config.triggers[layer];if(t.step&&(run.step-run.origin[layer])%t.every===0){draw(layer);layers.push(layer==='look'?'外观':'文案');}}note('进入第 '+run.step+' 步'+(layers.length?' → 更新'+layers.join('和'):'（未达到轮换步数）'));}renderLive();}
function clock(){if(!run.active)return;const changed=reconcile(run.pending?run.reason:'短暂提示到期');if(changed)renderSettings();if(!run.pending&&!changed){const layers=[];for(const layer of ['look','text'])if(run.next[layer]!==null&&Date.now()>=run.next[layer]){draw(layer);schedule(layer);layers.push(layer==='look'?'外观':'文案');}if(layers.length)note('时间间隔到达 → 在当前配置内更新'+layers.join('和'));}run.pulses=run.pulses.filter(p=>Date.now()-p.at<30000);renderLive();}
function renderLive(){const r=config.rules.find(r=>r.id===run.context),look=run.look||config.looks[0],s=currentSelection();$('run-state').textContent=run.active?'第 '+run.turn+' 轮 · 运行中':'已结束';$('running').style.color=look.color;$('running').style.fontSize=look.size+'px';$('icon').textContent=look.icon;$('label').textContent=run.active?run.line:'本轮已结束';$('label').className=run.active&&look.sweep?'sweep':'';$('duration').textContent=run.active?'模拟运行状态 · '+Math.floor((Date.now()-run.started)/1000)+' 秒':'点击工具按钮或“开始新一轮”继续';
const names=config.looks.filter(p=>s.lookMode==='fixed'?p.id===s.fixedLook:s.lookIds.includes(p.id)).map(p=>p.name).join('、');$('explanation').innerHTML='<div class="flow"><div><span class="muted">规则</span><b>'+esc(run.active?(r?r.name:'无命中 → 默认选择'):'未运行')+'</b></div><div><span class="muted">候选外观</span><span>'+esc(names)+'</span></div><div><span class="muted">实际抽到</span><span>'+esc(look.name)+' ＋ '+esc(run.group?run.group.name:'')+'</span></div></div><div class="why">'+(run.pending?'活动已改变，显示将在 500ms 合并窗口后更新。':!run.active?'结束后不再轮换，也不会残留旧错误。':r?(r.kind==='pulse'?'短暂提示到期后，重新检查还有哪些工具在工作。':'只要匹配的工具还在工作，规则就持续成立。同一规则不反复抽签。'):'默认配置负责兜底；可在“默认与轮换”修改。')+'</div>';
const html='<h3>正在执行的工具（'+run.calls.length+'）</h3>'+(run.calls.length?run.calls.map(c=>'<div class="tool"><span class="tool-name"><i class="dot"></i>'+esc(kinds[c.kind])+' #'+c.id+'</span><button class="small" data-act="finish" data-id="'+c.id+'">结束</button><button class="small danger" data-act="fail" data-id="'+c.id+'">失败</button></div>').join(''):'<div class="empty">还没有工具。每点击一次上方按钮，就是一个独立调用。</div>');if($('activities').innerHTML!==html)$('activities').innerHTML=html;
$('step-button').textContent='下一步骤（当前 '+run.step+'）';for(const id of ['step-button','end-button','error-button'])$(id).disabled=!run.active;const log=run.logs.map(t=>'<li>'+esc(t)+'</li>').join('');if($('log').innerHTML!==log)$('log').innerHTML=log;}
function selectionUI(s,owner){const a=key=>' data-owner="'+owner+'" data-sel="'+key+'"';const choices=(items,ids,key)=>items.map(p=>'<label class="check"><input type="checkbox"'+a(key)+' data-value="'+p.id+'"'+ck(ids.includes(p.id))+'>'+esc(p.name)+'</label>').join('');return '<div class="cols"><div class="box"><h3>外观怎么选</h3><select aria-label="外观选择方式"'+a('lookMode')+'>'+opt('fixed','固定一个',s.lookMode)+opt('random','从候选随机',s.lookMode)+'</select><div class="field">'+(s.lookMode==='fixed'?'<span>固定外观</span><select aria-label="固定外观"'+a('fixedLook')+'>'+config.looks.map(p=>opt(p.id,p.name,s.fixedLook)).join('')+'</select>':'<span>随机候选（至少一项）</span><div class="choices">'+choices(config.looks,s.lookIds,'lookIds')+'</div>')+'</div></div><div class="box"><h3>文案怎么选</h3><select aria-label="文案组选择方式"'+a('groupMode')+'>'+opt('fixed','固定一组',s.groupMode)+opt('random','候选组随机',s.groupMode)+'</select><div class="field">'+(s.groupMode==='fixed'?'<span>固定文案组</span><select aria-label="固定文案组"'+a('fixedGroup')+'>'+config.groups.map(p=>opt(p.id,p.name,s.fixedGroup)).join('')+'</select>':'<span>候选文案组</span><div class="choices">'+choices(config.groups,s.groupIds,'groupIds')+'</div>')+'</div><label class="field"><span>组内句子怎么选</span><select'+a('lineMode')+'>'+opt('first','固定第一句',s.lineMode)+opt('random','随机一句',s.lineMode)+opt('sequential','顺序换下一句',s.lineMode)+'</select></label></div></div>';}
function triggerUI(layer,title){const t=config.triggers[layer],a=key=>' data-trigger="'+layer+'" data-key="'+key+'"';return '<div class="box"><h3>'+title+'</h3><label class="check"><input type="checkbox"'+a('turn')+ck(t.turn)+'>新一轮重新抽取</label><div class="field"><label><input type="checkbox"'+a('time')+ck(t.time)+'> 按时间更新</label><label>每 <input type="number" aria-label="'+title+'间隔秒数" min="1" max="60"'+a('seconds')+' value="'+t.seconds+'"> 秒</label></div><div class="field"><label><input type="checkbox"'+a('step')+ck(t.step)+'> 按步骤更新</label><label>每 <input type="number" aria-label="'+title+'间隔步数" min="1" max="20"'+a('every')+' value="'+t.every+'"> 步</label></div></div>';}
function ruleUI(r,i){const open=editing===r.id,names=r.kind==='activity'?kinds:pulses;return '<article class="rule'+(open?' open':'')+(run.active&&run.context===r.id?' hit':'')+'"><div class="rule-head"><span class="muted">'+(i+1)+'</span><input type="checkbox" aria-label="启用 '+esc(r.name)+'" data-rule="'+r.id+'" data-key="enabled"'+ck(r.enabled)+'><div class="rule-title"><b>'+esc(r.name)+'</b> '+(run.active&&run.context===r.id?'<span class="pill">当前命中</span>':'')+'</div><button class="small" aria-label="上移规则" data-act="up" data-id="'+r.id+'"'+(i===0?' disabled':'')+'>↑</button><button class="small" aria-label="下移规则" data-act="down" data-id="'+r.id+'"'+(i===config.rules.length-1?' disabled':'')+'>↓</button><button class="small" data-act="edit" data-id="'+r.id+'">'+(open?'收起':'编辑')+'</button></div><div class="rule-summary">'+(r.kind==='activity'?'活动：':'瞬时：')+esc(r.any.map(k=>names[k]).join(' 或 ')||'未选择条件')+(r.kind==='pulse'?' · 保持 '+r.hold+' 秒':'')+'</div>'+(open?'<div class="rule-body"><label class="field"><span>规则名称</span><input type="text" maxlength="50" data-rule="'+r.id+'" data-key="name" value="'+esc(r.name)+'"></label><label class="field"><span>什么时候成立</span><select data-rule="'+r.id+'" data-key="kind">'+opt('activity','工具执行期间持续生效',r.kind)+opt('pulse','事件发生后短暂生效',r.kind)+'</select></label><div class="field"><span>满足任意一项（OR）</span><div class="choices">'+Object.entries(names).map(([k,n])=>'<label class="check"><input type="checkbox" data-rule="'+r.id+'" data-key="any" data-value="'+k+'"'+ck(r.any.includes(k))+'>'+esc(n)+'</label>').join('')+'</div></div>'+(r.kind==='pulse'?'<label class="field"><span>保持时间（秒）</span><input type="number" min="1" max="10" data-rule="'+r.id+'" data-key="hold" value="'+r.hold+'"></label>':'<p class="hint">匹配的工具全部结束后自动退出，不需要再写“结束时恢复”规则。</p>')+'<h3>匹配后采用的选择配置</h3>'+selectionUI(r.selection,r.id)+'<div class="row between" style="margin-top:10px"><span class="muted">轮换间隔沿用“默认与轮换”。</span><button class="small danger" data-act="delete" data-id="'+r.id+'">删除规则</button></div></div>':'')+'</article>';}
function renderSettings(){for(const el of document.querySelectorAll('[data-tab]'))el.classList.toggle('active',el.dataset.tab===tab);if(tab==='rules')$('settings').innerHTML='<div class="row between"><label><input id="rules-enabled" type="checkbox"'+ck(config.enabled)+'> 启用事件规则</label><button class="small" data-act="add">＋ 添加规则</button></div><p class="hint">从上往下检查，第一条符合的规则胜出。关闭开关可对比默认策略。</p>'+config.rules.map(ruleUI).join('')+'<p class="hint">试试：启用“任意工具工作中”，把它移到搜索规则上方，观察哪个规则胜出。</p>';else if(tab==='base')$('settings').innerHTML='<h3>没有规则命中时使用</h3>'+selectionUI(config.base,'base')+'<div class="section"><h3>什么时候再抽一次</h3><p class="hint">对默认状态和所有规则都有效。文案更新会重新选组，再选一句。固定外观重复抽取仍是同一个。</p><div class="cols">'+triggerUI('look','外观轮换')+triggerUI('text','文案轮换')+'</div><p class="hint">进入新规则先刷新一次，并重新计时。同一规则连续命中不会重置计时。步骤需在左侧手动点击。</p></div>';else $('settings').innerHTML='<h3>外观预设</h3><p class="hint">预设只管内容和样子，不决定什么时候使用。</p>'+config.looks.map(p=>'<div class="preset row"><b>'+esc(p.name)+'</b><label class="row muted">颜色 <input type="color" aria-label="'+esc(p.name)+'颜色" data-look="'+p.id+'" data-key="color" value="'+esc(p.color)+'"></label><label class="row muted">字号 <input type="number" min="12" max="24" data-look="'+p.id+'" data-key="size" value="'+p.size+'"></label><label class="check"><input type="checkbox" data-look="'+p.id+'" data-key="sweep"'+ck(p.sweep)+'>扫光</label></div>').join('')+'<div class="section"><h3>文案预设</h3>'+config.groups.map(g=>'<label class="field preset"><b>'+esc(g.name)+'</b><span>每行一句；修改后点击输入框外生效。</span><textarea data-group="'+g.id+'">'+esc(g.lines.join('\n'))+'</textarea></label>').join('')+'</div>';}
function render(){renderLive();renderSettings();}
function apply(reason){if(run.active)reconcile(reason,true);render();}
function clamp(value,min,max,fallback){const n=Number(value);return Number.isFinite(n)?Math.max(min,Math.min(max,Math.round(n))):fallback;}
document.addEventListener('change',event=>{const e=event.target,d=e.dataset;if(e.id==='rules-enabled'){config.enabled=e.checked;apply('事件规则'+(e.checked?'开启':'关闭'));return;}if(d.sel){const s=d.owner==='base'?config.base:config.rules.find(r=>r.id===d.owner).selection,key=d.sel;if(key==='lookIds'||key==='groupIds'){const next=e.checked?[...s[key],d.value]:s[key].filter(v=>v!==d.value);if(!next.length){e.checked=true;note('候选至少保留一项');renderLive();return;}s[key]=[...new Set(next)];}else s[key]=e.value;apply('选择配置已修改');}else if(d.trigger){const t=config.triggers[d.trigger];t[d.key]=e.type==='checkbox'?e.checked:clamp(e.value,1,d.key==='every'?20:60,t[d.key]);schedule(d.trigger);note('轮换时机已修改，重新计时');render();}else if(d.rule){const r=config.rules.find(r=>r.id===d.rule);if(d.key==='any')r.any=e.checked?[...new Set([...r.any,d.value])]:r.any.filter(v=>v!==d.value);else if(d.key==='kind'){r.kind=e.value;r.any=e.value==='activity'?['tool']:['error'];}else if(d.key==='hold')r.hold=clamp(e.value,1,10,2);else r[d.key]=e.type==='checkbox'?e.checked:e.value.trim()||'未命名规则';apply('规则配置已修改');}else if(d.look){const p=config.looks.find(p=>p.id===d.look);p[d.key]=e.type==='checkbox'?e.checked:d.key==='size'?clamp(e.value,12,24,16):e.value;render();}else if(d.group){config.groups.find(g=>g.id===d.group).lines=e.value.split('\n');apply('文案内容已修改');}});
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.tab){tab=d.tab;renderSettings();return;}switch(d.act){case 'tool':startTool(d.kind);break;case 'parallel':if(!run.active)newTurn();run.calls.push({id:++serial,kind:'search'},{id:++serial,kind:'search'});note('两个搜索同时开始：分别结束它们，观察规则是否退出');reconcile('并行搜索开始');render();break;case 'finish':finish(Number(d.id),false);break;case 'fail':finish(Number(d.id),true);break;case 'error':if(run.active){pulse('error');render();}break;case 'step':advanceStep();break;case 'new-turn':newTurn();break;case 'end':endTurn();break;case 'edit':editing=editing===d.id?null:d.id;renderSettings();break;case 'up':case 'down':{const i=config.rules.findIndex(r=>r.id===d.id),j=i+(d.act==='up'?-1:1);if(j>=0&&j<config.rules.length)[config.rules[i],config.rules[j]]=[config.rules[j],config.rules[i]];apply('规则优先级已修改');break;}case 'add':{const r={id:'custom-'+(++ruleSerial),name:'新规则',enabled:true,kind:'activity',any:['tool'],hold:2,selection:JSON.parse(JSON.stringify(config.base))};config.rules.push(r);editing=r.id;apply('添加规则');break;}case 'delete':config.rules=config.rules.filter(r=>r.id!==d.id);editing=null;apply('删除规则');break;case 'reset':config=initial();tab='rules';editing='search';serial=0;ruleSerial=0;Object.assign(run,{active:true,turn:1,step:0,calls:[],pulses:[],context:null,signature:'',look:null,group:null,line:'',last:-Infinity,next:{look:null,text:null},origin:{look:0,text:0},cursor:{},pending:false,reason:'',logs:[],started:Date.now()});reconcile('小样已重置',true);render();break;}});
reconcile('小样开始运行',true);render();
const heartbeat=setInterval(clock,200);
window.addEventListener('pagehide',()=>clearInterval(heartbeat));
</script></body></html>
